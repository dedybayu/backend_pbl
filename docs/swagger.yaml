        type: integer
      rumah:
        $ref: '#/definitions/models.Rumah'
      rumah_id:
        type: integer
      tagihan_iurans:
        description: Relasi one-to-many
        items:
          $ref: '#/definitions/models.TagihanIuran'
        type: array
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
      warga_id:
        type: integer
      warga_jenis_kelamin:
        type: string
      warga_nama:
        type: string
      warga_nik:
        type: string
      warga_no_tlp:
        type: string
      warga_status_aktif:
        type: string
      warga_status_hidup:
        type: string
      warga_tanggal_lahir:
        type: string
      warga_tempat_lahir:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/kategori-kegiatan:
    get:
      description: Mendapatkan daftar semua kategori kegiatan tanpa pagination limit
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan semua kategori kegiatan
      tags:
      - kategori-kegiatan
    post:
      consumes:
      - multipart/form-data
      description: Membuat kategori kegiatan baru dengan nama yang unik
      parameters:
      - description: Nama kategori kegiatan
        in: formData
        name: kategori_kegiatan_nama
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Kategori kegiatan berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Membuat kategori kegiatan baru
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/{id}:
    delete:
      description: Menghapus kategori kegiatan berdasarkan ID, hanya jika tidak memiliki
        kegiatan terkait
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tidak dapat menghapus kategori yang memiliki kegiatan
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menghapus kategori kegiatan
      tags:
      - kategori-kegiatan
    get:
      description: Mendapatkan detail kategori kegiatan beserta daftar kegiatan terkait
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan kategori kegiatan berdasarkan ID
      tags:
      - kategori-kegiatan
    put:
      consumes:
      - multipart/form-data
      description: Mengupdate nama kategori kegiatan berdasarkan ID
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      - description: Nama kategori kegiatan baru
        in: formData
        name: kategori_kegiatan_nama
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan berhasil diupdate
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengupdate kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mengupdate kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/dropdown:
    get:
      description: Mendapatkan daftar kategori kegiatan sederhana untuk dropdown/select
      produces:
      - application/json
      responses:
        "200":
          description: Dropdown kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data dropdown
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan dropdown kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/search:
    get:
      description: Mencari kategori kegiatan berdasarkan nama
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hasil pencarian kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parameter pencarian harus diisi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mencari kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mencari kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/stats:
    get:
      description: Mendapatkan kategori kegiatan beserta jumlah kegiatan di setiap
        kategori
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan dengan statistik
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil statistik kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan kategori kegiatan dengan statistik
      tags:
      - kategori-kegiatan
  /api/produk:
    get:
      description: Mendapatkan semua produk
      parameters:
      - description: Cari produk berdasarkan nama atau deskripsi
        in: query
        name: search
        type: string
      - description: Filter produk berdasarkan ID kategori
        in: query
        name: kategori_id
        type: string
      - description: Filter produk berdasarkan stok minimum
        in: query
        name: stok_min
        type: string
      - description: Filter produk berdasarkan stok maksimum
        in: query
        name: stok_max
        type: string
      - description: Filter produk berdasarkan harga minimum
        in: query
        name: harga_min
        type: string
      - description: Filter produk berdasarkan harga maksimum
        in: query
        name: harga_max
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan semua produk
      tags:
      - Produk
    post:
      consumes:
      - multipart/form-data
      description: Membuat produk baru dengan upload foto
      parameters:
      - description: Nama Produk
        in: formData
        name: produk_nama
        required: true
        type: string
      - description: Deskripsi Produk
        in: formData
        name: produk_deskripsi
        type: string
      - description: Stok Produk
        in: formData
        name: produk_stok
        required: true
        type: integer
      - description: Harga Produk
        in: formData
        name: produk_harga
        required: true
        type: number
      - description: ID Kategori Produk
        in: formData
        name: kategori_produk_id
        required: true
        type: integer
      - description: ID User
        in: formData
        name: user_id
        required: true
        type: integer
      - description: Foto Produk
        in: formData
        name: produk_foto
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Produk'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Membuat produk baru
      tags:
      - Produk
  /api/produk/{id}:
    delete:
      description: Menghapus produk dan foto terkait
      parameters:
      - description: Produk ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Hapus produk
      tags:
      - Produk
    get:
      description: Mendapatkan produk berdasarkan ID
      parameters:
      - description: Produk ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan produk berdasarkan ID
      tags:
      - Produk
    put:
      consumes:
      - multipart/form-data
      description: Update produk termasuk upload foto baru
      parameters:
      - description: Produk ID
        in: path
        name: id
        required: true
        type: integer
      - description: Nama Produk
        in: formData
        name: produk_nama
        type: string
      - description: Deskripsi Produk
        in: formData
        name: produk_deskripsi
        type: string
      - description: Stok Produk
        in: formData
        name: produk_stok
        type: integer
      - description: Harga Produk
        in: formData
        name: produk_harga
        type: number
      - description: ID Kategori Produk
        in: formData
        name: kategori_produk_id
        type: integer
      - description: ID User
        in: formData
        name: user_id
        type: integer
      - description: Foto Produk
        in: formData
        name: produk_foto
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Produk'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update produk
      tags:
      - Produk
  /api/produk/{id}/stok:
    patch:
      consumes:
      - multipart/form-data
      description: Mengupdate stok produk (form data)
      parameters:
      - description: Produk ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stok baru
        in: formData
        name: produk_stok
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Produk'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update stok produk
      tags:
      - Produk
  /api/produk/image/{filename}:
    get:
      description: Mengirim file foto produk
      parameters:
      - description: Nama file foto
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Serve file foto produk
      tags:
      - Produk
  /api/produk/statistik:
    get:
      description: Mendapatkan statistik produk (total, stok, nilai inventori, dll)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Statistik produk
      tags:
      - Produk
  /api/produk/stok-menipis:
    get:
      description: Mendapatkan produk dengan stok menipis (<10)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Produk'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Produk stok menipis
      tags:
      - Produk
  /api/produk/terbaru:
    get:
      description: Mendapatkan daftar produk terbaru
      parameters:
      - description: Limit produk
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Produk'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Produk terbaru
      tags:
      - Produk
swagger: "2.0"
