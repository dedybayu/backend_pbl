  models.Rumah:
    properties:
      created_at:
        type: string
      rumah_alamat:
        type: string
      rumah_id:
        type: integer
      rumah_status:
        type: string
      updated_at:
        type: string
      wargas:
        items:
          $ref: '#/definitions/models.Warga'
        type: array
    type: object
  models.TagihanIuran:
    properties:
      created_at:
        type: string
      id:
        type: integer
      tagihan_iuran:
        type: string
      tagihan_iuran_nominal:
        type: number
      tagihan_iuran_status:
        type: string
      updated_at:
        type: string
      warga:
        $ref: '#/definitions/models.Warga'
      warga_id:
        type: integer
    type: object
  models.User:
    properties:
      alamat:
        type: string
      created_at:
        type: string
      email:
        type: string
      foto_profile:
        type: string
      level:
        $ref: '#/definitions/models.Level'
      level_id:
        type: integer
      nama:
        type: string
      no_telp:
        type: string
      password:
        type: string
      produk:
