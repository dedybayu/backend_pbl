definitions:
  controllers.AuthUserResponse:
    properties:
      foto_profile:
        example: profile.jpg
        type: string
      level:
        $ref: '#/definitions/models.Level'
      level_id:
        example: 1
        type: integer
      user_alamat:
        example: Jl. Contoh No. 123
        type: string
      user_email:
        example: admin@example.com
        type: string
      user_id:
        example: 1
        type: integer
      user_nama:
        example: Administrator
        type: string
      user_no_telp:
        example: "081234567890"
        type: string
      username:
        example: admin
        type: string
      warga:
        allOf:
        - $ref: '#/definitions/models.Warga'
        description: hanya tampil jika tidak nil
    type: object
  controllers.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  controllers.LoginResponse:
    properties:
      level:
        $ref: '#/definitions/models.Level'
      level_kode:
        example: ADM
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/controllers.AuthUserResponse'
    type: object
  controllers.LogoutResponse:
    properties:
      message:
        example: Logout successful
        type: string
    type: object
  controllers.ProfileResponse:
    properties:
      level:
        $ref: '#/definitions/models.Level'
      user:
        $ref: '#/definitions/models.User'
    type: object
  controllers.RefreshTokenResponse:
    properties:
      message:
        example: Token refreshed successfully
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  models.Agama:
    properties:
      agama_id:
        type: integer
      agama_nama:
        type: string
      created_at:
        type: string
      updated_at:
        type: string
      wargas:
        items:
          $ref: '#/definitions/models.Warga'
        type: array
    type: object
  models.KategoriProduk:
    properties:
      created_at:
        type: string
      kategori_produk_id:
        type: integer
      kategori_produk_nama:
        type: string
      produks:
        items:
          $ref: '#/definitions/models.Produk'
        type: array
      updated_at:
        type: string
    type: object
  models.Keluarga:
    properties:
      created_at:
        type: string
      keluarga_id:
        type: integer
      keluarga_nama:
        type: string
      keluarga_status:
        type: string
      mutasiKeluargas:
        items:
          $ref: '#/definitions/models.MutasiKeluarga'
        type: array
      updated_at:
        type: string
      wargas:
        items:
          $ref: '#/definitions/models.Warga'
        type: array
    type: object
  models.Level:
    properties:
      created_at:
        type: string
      level_id:
        type: integer
      level_kode:
        type: string
      level_nama:
        type: string
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.MutasiKeluarga:
    properties:
      created_at:
        type: string
      keluarga:
        $ref: '#/definitions/models.Keluarga'
      keluarga_id:
        type: integer
      mutasi_keluarga_alasan:
        type: string
      mutasi_keluarga_id:
        type: integer
      mutasi_keluarga_jenis:
        type: string
      mutasi_keluarga_tanggal:
        type: string
      updated_at:
        type: string
    type: object
  models.Pekerjaan:
    properties:
      created_at:
        type: string
      pekerjaan_id:
        type: integer
      pekerjaan_nama:
        type: string
      updated_at:
        type: string
      wargas:
        items:
          $ref: '#/definitions/models.Warga'
        type: array
    type: object
  models.Produk:
    properties:
      created_at:
        type: string
      kategori_produk:
        $ref: '#/definitions/models.KategoriProduk'
      kategori_produk_id:
        type: integer
      produk_deskripsi:
        type: string
      produk_foto:
        type: string
      produk_harga:
        type: number
      produk_id:
        type: integer
      produk_nama:
        type: string
      produk_stok:
        type: integer
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.Rumah:
    properties:
      created_at:
        type: string
      rumah_alamat:
        type: string
      rumah_id:
        type: integer
      rumah_status:
        type: string
      updated_at:
        type: string
      wargas:
        items:
          $ref: '#/definitions/models.Warga'
        type: array
    type: object
  models.TagihanIuran:
    properties:
      created_at:
        type: string
      id:
        type: integer
      tagihan_iuran:
        type: string
      tagihan_iuran_nominal:
        type: number
      tagihan_iuran_status:
        type: string
      updated_at:
        type: string
      warga:
        $ref: '#/definitions/models.Warga'
      warga_id:
        type: integer
    type: object
  models.User:
    properties:
      alamat:
        type: string
      created_at:
        type: string
      email:
        type: string
      foto_profile:
        type: string
      level:
        $ref: '#/definitions/models.Level'
      level_id:
        type: integer
      nama:
        type: string
      no_telp:
        type: string
      password:
        type: string
      produk:
        description: one-to-many produk
        items:
          $ref: '#/definitions/models.Produk'
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
      username:
        type: string
      warga:
        allOf:
        - $ref: '#/definitions/models.Warga'
        description: one-to-one
    type: object
  models.Warga:
    properties:
      agama:
        $ref: '#/definitions/models.Agama'
      agama_id:
        type: integer
      created_at:
        type: string
      keluarga:
        allOf:
        - $ref: '#/definitions/models.Keluarga'
        description: Relasi many-to-one
      keluarga_id:
        type: integer
      pekerjaan:
        $ref: '#/definitions/models.Pekerjaan'
      pekerjaan_id:
        type: integer
      rumah:
        $ref: '#/definitions/models.Rumah'
      rumah_id:
        type: integer
      tagihan_iurans:
        description: Relasi one-to-many
        items:
          $ref: '#/definitions/models.TagihanIuran'
        type: array
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
      warga_id:
        type: integer
      warga_jenis_kelamin:
        type: string
      warga_nama:
        type: string
      warga_nik:
        type: string
      warga_no_tlp:
        type: string
      warga_status_aktif:
        type: string
      warga_status_hidup:
        type: string
      warga_tanggal_lahir:
        type: string
      warga_tempat_lahir:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/agama:
    get:
      consumes:
      - application/json
      description: Mengambil seluruh data agama dari database
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan data agama
          schema:
            items:
              $ref: '#/definitions/models.Agama'
            type: array
        "500":
          description: Gagal mengambil data agama
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan semua data agama
      tags:
      - Agama
  /api/broadcast:
    get:
      consumes:
      - application/json
      description: Mendapatkan semua data broadcast dengan pagination dan search
      parameters:
      - description: 'Nomor halaman (default: 1)'
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 10)'
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data broadcast berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data broadcast
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan semua data broadcast
      tags:
      - Broadcast
    post:
      consumes:
      - multipart/form-data
      description: Membuat data broadcast baru dengan form-data
      parameters:
      - description: Nama broadcast (2-200 karakter)
        in: formData
        name: broadcast_nama
        required: true
        type: string
      - description: Deskripsi broadcast
        in: formData
        name: broadcast_deskripsi
        type: string
      - description: Foto broadcast (jpg, jpeg, png, max 5MB)
        in: formData
        name: broadcast_foto
        type: file
      - description: Dokumen broadcast (pdf, doc, docx, max 10MB)
        in: formData
        name: broadcast_dokumen
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Broadcast berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Data form tidak valid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat broadcast
          schema:
            additionalProperties: true
            type: object
      summary: Membuat broadcast baru
      tags:
      - Broadcast
  /api/broadcast/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus data broadcast berdasarkan ID
      parameters:
      - description: ID Broadcast
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Broadcast berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Broadcast tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus broadcast
          schema:
            additionalProperties: true
            type: object
      summary: Menghapus broadcast
      tags:
      - Broadcast
    get:
      consumes:
      - application/json
      description: Mendapatkan detail data broadcast berdasarkan ID
      parameters:
      - description: ID Broadcast
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Data broadcast berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Broadcast tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data broadcast
          schema:
            additionalProperties: true
            type: object
      summary: Mendapatkan broadcast berdasarkan ID
      tags:
      - Broadcast
    put:
      consumes:
      - multipart/form-data
      description: Mengupdate data broadcast berdasarkan ID dengan form-data
      parameters:
      - description: ID Broadcast
        in: path
        name: id
        required: true
        type: integer
      - description: Nama broadcast (2-200 karakter)
        in: formData
        name: broadcast_nama
        type: string
      - description: Deskripsi broadcast
        in: formData
        name: broadcast_deskripsi
        type: string
      - description: Foto broadcast baru (jpg, jpeg, png, max 5MB)
        in: formData
        name: broadcast_foto
        type: file
      - description: Dokumen broadcast baru (pdf, doc, docx, max 10MB)
        in: formData
        name: broadcast_dokumen
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Broadcast berhasil diupdate
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Data form tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Broadcast tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengupdate broadcast
          schema:
            additionalProperties: true
            type: object
      summary: Mengupdate data broadcast
      tags:
      - Broadcast
  /api/detail-transaksi/{id}:
    get:
      description: Mendapatkan detail transaksi berdasarkan ID detail
      parameters:
      - description: ID Detail Transaksi
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail transaksi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Detail tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data detail
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dapatkan detail berdasarkan ID
      tags:
      - detail-transaksi
  /api/detail-transaksi/transaksi/{transaksi_id}:
    get:
      description: Mendapatkan semua detail transaksi berdasarkan ID transaksi
      parameters:
      - description: ID Transaksi
        in: path
        name: transaksi_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar detail transaksi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Transaksi tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data detail
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dapatkan detail transaksi
      tags:
      - detail-transaksi
  /api/kategori-kegiatan:
    get:
      description: Mendapatkan daftar semua kategori kegiatan tanpa pagination limit
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan semua kategori kegiatan
      tags:
      - kategori-kegiatan
    post:
      consumes:
      - multipart/form-data
      description: Membuat kategori kegiatan baru dengan nama yang unik
      parameters:
      - description: Nama kategori kegiatan
        in: formData
        name: kategori_kegiatan_nama
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Kategori kegiatan berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Membuat kategori kegiatan baru
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/{id}:
    delete:
      description: Menghapus kategori kegiatan berdasarkan ID, hanya jika tidak memiliki
        kegiatan terkait
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan berhasil dihapus
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tidak dapat menghapus kategori yang memiliki kegiatan
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menghapus kategori kegiatan
      tags:
      - kategori-kegiatan
    get:
      description: Mendapatkan detail kategori kegiatan beserta daftar kegiatan terkait
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detail kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan kategori kegiatan berdasarkan ID
      tags:
      - kategori-kegiatan
    put:
      consumes:
      - multipart/form-data
      description: Mengupdate nama kategori kegiatan berdasarkan ID
      parameters:
      - description: ID Kategori Kegiatan
        in: path
        name: id
        required: true
        type: integer
      - description: Nama kategori kegiatan baru
        in: formData
        name: kategori_kegiatan_nama
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan berhasil diupdate
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Kategori kegiatan tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengupdate kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mengupdate kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/dropdown:
    get:
      description: Mendapatkan daftar kategori kegiatan sederhana untuk dropdown/select
      produces:
      - application/json
      responses:
        "200":
          description: Dropdown kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data dropdown
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan dropdown kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/search:
    get:
      description: Mencari kategori kegiatan berdasarkan nama
      parameters:
      - description: Kata kunci pencarian
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hasil pencarian kategori kegiatan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parameter pencarian harus diisi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mencari kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mencari kategori kegiatan
      tags:
      - kategori-kegiatan
  /api/kategori-kegiatan/stats:
    get:
      description: Mendapatkan kategori kegiatan beserta jumlah kegiatan di setiap
        kategori
      produces:
      - application/json
      responses:
        "200":
          description: Kategori kegiatan dengan statistik
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil statistik kategori kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan kategori kegiatan dengan statistik
      tags:
      - kategori-kegiatan
  /api/kegiatan:
    get:
      description: Mendapatkan daftar semua kegiatan dengan filter dan pagination
      parameters:
      - description: 'Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Limit per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - description: Filter berdasarkan ID kategori
        in: query
        name: kategori_id
        type: integer
      - description: 'Filter tanggal mulai (format: YYYY-MM-DD)'
        in: query
        name: tanggal_from
        type: string
      - description: 'Filter tanggal sampai (format: YYYY-MM-DD)'
        in: query
        name: tanggal_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar kegiatan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan semua kegiatan
      tags:
      - kegiatan
    post:
      consumes:
      - multipart/form-data
      description: Membuat kegiatan baru dengan data yang diberikan
      parameters:
      - description: Nama kegiatan
        in: formData
        name: kegiatan_nama
        required: true
        type: string
      - description: ID kategori kegiatan
        in: formData
        name: kategori_kegiatan_id
        required: true
        type: integer
      - description: 'Tanggal kegiatan (format: RFC3339)'
        in: formData
        name: kegiatan_tanggal
        required: true
        type: string
      - description: Lokasi kegiatan
        in: formData
        name: kegiatan_lokasi
        type: string
      - description: Penanggung jawab kegiatan
        in: formData
        name: kegiatan_pj
        type: string
      - description: Deskripsi kegiatan
        in: formData
        name: kegiatan_deskripsi
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Kegiatan berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request data
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat kegiatan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Membuat kegiatan baru
      tags:
      - kegiatan
